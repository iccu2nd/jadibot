<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadibot — Admin</title>
<meta name="theme-color" content="#6d5bf6">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<script>
  try {
    var t = localStorage.getItem('jadibot_theme')
    if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark')
    }
  } catch (e) {}
</script>
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark"><i class="fa-solid fa-user-shield"></i></span>
    <span class="brand-name">jadibot admin</span>
  </div>
  <div class="topbar-actions">
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Ganti tema terang/gelap">
      <i class="fa-solid fa-moon"></i>
      <i class="fa-solid fa-sun"></i>
    </button>
    <button class="hamburger" id="hamburger-btn" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="topnav">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div class="nav-backdrop" id="nav-backdrop"></div>
<nav class="topnav" id="topnav" aria-label="Menu utama">
  <div class="nav-head">
    <span class="nav-brand"><span class="brand-mark"><i class="fa-solid fa-robot"></i></span> jadibot</span>
    <button class="nav-close" id="nav-close" type="button" aria-label="Tutup menu"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="nav-group">
    <span class="nav-group-label">Navigasi</span>
    <a class="topnav-link" href="/dashboard"><i class="fa-solid fa-house"></i> Beranda</a>
    <a class="topbar-admin" href="/admin"><i class="fa-solid fa-user-shield"></i> Admin</a>
  </div>
  <div class="nav-foot">
    <div class="nav-foot-row">
      <button class="nav-chip" id="nav-theme-chip" type="button"><i class="fa-solid fa-moon"></i> <span id="nav-theme-label">Gelap</span></button>
    </div>
  </div>
</nav>

<main class="admin-wrap">
  <section class="panel">
    <h2 class="panel-title"><i class="fa-solid fa-satellite-dish" style="color:var(--primary-solid)"></i> Bot yang terhubung</h2>
    <div class="admin-toolbar">
      <input id="input-key" type="password" placeholder="Admin key (x-admin-key)" autocomplete="off">
      <button id="btn-load" class="btn-primary"><i class="fa-solid fa-arrows-rotate"></i> Muat daftar</button>
    </div>
    <p class="error" id="admin-error" hidden></p>
    <p class="summary" id="summary" hidden></p>
    <div id="table-wrap"></div>
  </section>
</main>

<script src="nav.js"></script>
<script src="admin.js"></script>
</body>
</html>
