<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadibot — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .admin-wrap { max-width: 900px; margin: 0 auto; padding: 40px clamp(20px, 6vw, 64px) 80px; position: relative; z-index: 1; }
  .admin-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; margin-bottom: 22px; }
  .admin-toolbar input {
    flex: 1; min-width: 220px;
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-family: var(--font-body);
    font-size: 14.5px;
    outline: none;
  }
  .admin-toolbar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 110, 246, 0.15); }
  .admin-toolbar .btn-primary { flex-shrink: 0; width: auto; padding: 12px 22px; }
  .bot-table { width: 100%; border-collapse: collapse; font-family: var(--font-body); font-size: 13.5px; }
  .bot-table th, .bot-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line-soft); }
  .bot-table th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid currentColor; border-radius: 999px; font-size: 11px; font-weight: 600; font-family: var(--font-body); }
  .pill-connected { color: var(--success); }
  .pill-reconnecting { color: var(--warn); }
  .pill-other { color: var(--muted); }
  .empty-state { color: var(--muted); padding: 30px 0; text-align: center; font-family: var(--font-body); font-size: 13.5px; }
  .summary { color: var(--muted); font-size: 13px; margin-bottom: 14px; font-family: var(--font-body); }
  .stop-btn { background: transparent; border: 1px solid var(--danger); border-radius: var(--radius-sm); color: var(--danger-solid); padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: var(--font-body); }
  .stop-btn:hover { background: var(--danger); color: #fff; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◆</span>
    <span class="brand-name">jadibot admin</span>
  </div>
  <button class="hamburger" id="hamburger-btn" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="topnav">
    <span></span><span></span><span></span>
  </button>
  <nav class="topnav" id="topnav">
    <a class="topnav-link" href="/dashboard">Beranda</a>
    <a class="topbar-admin" href="/admin">Admin</a>
  </nav>
</header>

<main class="admin-wrap">
  <section class="panel">
    <h2 class="panel-title">Bot yang terhubung</h2>
    <div class="admin-toolbar">
      <input id="input-key" type="password" placeholder="Admin key (x-admin-key)" autocomplete="off">
      <button id="btn-load" class="btn-primary">Muat daftar</button>
    </div>
    <p class="error" id="admin-error" hidden></p>
    <p class="summary" id="summary" hidden></p>
    <div id="table-wrap"></div>
  </section>
</main>

<script src="nav.js"></script>
<script src="admin.js"></script>
</body>
</html>
