<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadibot — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .admin-wrap { max-width: 900px; margin: 0 auto; padding: 40px clamp(20px, 6vw, 64px) 80px; position: relative; z-index: 1; }
  .admin-toolbar { display: flex; gap: 0; flex-wrap: wrap; align-items: stretch; margin-bottom: 22px; border: 1px solid var(--panel-border); }
  .admin-toolbar input { flex: 1; min-width: 220px; border: none; border-right: 1px solid var(--panel-border); }
  .admin-toolbar .btn-primary { flex-shrink: 0; }
  .bot-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 13px; }
  .bot-table th, .bot-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line-soft); }
  .bot-table th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .04em; border-bottom: 1px solid var(--panel-border); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1px solid currentColor; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; font-family: var(--font-mono); }
  .pill-connected { color: var(--success); }
  .pill-reconnecting { color: var(--warn); }
  .pill-other { color: var(--muted); }
  .empty-state { color: var(--muted); padding: 30px 0; text-align: center; font-family: var(--font-mono); font-size: 13px; }
  .summary { color: var(--muted); font-size: 13px; margin-bottom: 14px; font-family: var(--font-mono); }
  .stop-btn { background: transparent; border: 1px solid var(--danger); color: var(--danger-solid); padding: 5px 10px; font-size: 12px; cursor: pointer; font-family: var(--font-mono); }
  .stop-btn:hover { background: var(--danger); color: var(--bg); }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◆</span>
    <span class="brand-name">jadibot admin</span>
  </div>
  <button class="hamburger" id="hamburger-btn" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="topnav">
    <span></span><span></span><span></span>
  </button>
  <nav class="topnav" id="topnav">
    <span class="topbar-sub">daftar semua bot yang tersambung</span>
    <a class="topnav-link" href="/dashboard">Beranda</a>
    <a class="topnav-link" href="/admin">Admin</a>
  </nav>
</header>

<main class="admin-wrap">
  <section class="panel">
    <h2 class="panel-title">Bot yang terhubung</h2>
    <div class="admin-toolbar">
      <input id="input-key" type="password" placeholder="Admin key (x-admin-key)" autocomplete="off">
      <button id="btn-load" class="btn-primary">Muat daftar</button>
    </div>
    <p class="error" id="admin-error" hidden></p>
    <p class="summary" id="summary" hidden></p>
    <div id="table-wrap"></div>
  </section>
</main>

<script src="nav.js"></script>
<script src="admin.js"></script>
</body>
</html>
