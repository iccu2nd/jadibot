<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk — jadibot</title>
<meta name="theme-color" content="#6d5bf6">
<link rel="icon" type="image/png" href="https://i.ibb.co/ccwYGLBq/18afb294007b.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  try {
    var t = localStorage.getItem('jadibot_theme')
    if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark')
    }
  } catch (e) {}
</script>
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<div class="auth-shell">
  <div class="auth-card">
    <a class="auth-logo" href="/">
      <span class="brand-mark is-logo"><img src="https://i.ibb.co/ccwYGLBq/18afb294007b.png" alt="jadibot"></span>
      <span>jadibot</span>
    </a>

    <div class="auth-tabs" role="tablist">
      <button class="auth-tab is-active" type="button" data-mode="login">Masuk</button>
      <button class="auth-tab" type="button" data-mode="register">Daftar</button>
    </div>

    <div class="auth-head">
      <h1 id="auth-title">Masuk ke akun kamu</h1>
      <p id="auth-subtitle">Kelola bot WhatsApp kamu dari dashboard.</p>
    </div>

    <div id="google-signin-btn"></div>
    <p class="auth-foot" id="google-note" hidden style="margin-top:0 0 14px;">Login Google belum diaktifkan admin di server ini.</p>

    <div class="auth-divider">atau pakai email</div>

    <p class="auth-error" id="auth-error" hidden></p>

    <form class="auth-form" id="form-login">
      <div class="auth-field">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" autocomplete="email" required placeholder="kamu@email.com">
      </div>
      <div class="auth-field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <button class="auth-submit" type="submit" id="login-submit">Masuk</button>
    </form>

    <form class="auth-form" id="form-register" hidden>
      <div class="auth-field">
        <label for="register-name">Nama</label>
        <input id="register-name" type="text" autocomplete="name" required placeholder="Nama kamu">
      </div>
      <div class="auth-field">
        <label for="register-email">Email</label>
        <input id="register-email" type="email" autocomplete="email" required placeholder="kamu@email.com">
      </div>
      <div class="auth-field">
        <label for="register-password">Password</label>
        <input id="register-password" type="password" autocomplete="new-password" required placeholder="Minimal 8 karakter">
      </div>
      <button class="auth-submit" type="submit" id="register-submit">Buat akun</button>
    </form>

    <p class="auth-foot" id="auth-switch-hint">
      Belum punya akun? <a href="#" id="auth-switch-link">Daftar di sini</a>
    </p>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
