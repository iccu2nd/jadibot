<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk — Botzora</title><link rel="icon" href="https://i.ibb.co/ccwYGLBq/18afb294007b.png"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><script>try{var t=localStorage.getItem('jadibot_theme');if(t)document.documentElement.setAttribute('data-theme',t);else if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script></head>
<body><main class="auth-shell">
<div class="auth-topbar"><a class="auth-logo" href="/"><span class="brand-mark is-logo"><img src="https://i.ibb.co/ccwYGLBq/18afb294007b.png" alt=""></span>botzora</a><button class="auth-signup-btn" type="button" id="auth-top-switch">Daftar</button></div>
<div class="auth-center"><div class="auth-card">
<div class="auth-head"><h1 id="auth-title">Masuk ke Botzora</h1><p id="auth-subtitle">Kelola bot WhatsApp Anda dari satu dashboard.</p></div>
<div id="google-signin-btn" class="auth-google"></div>
<p class="auth-foot" id="google-note" hidden>Masuk dengan Google belum diaktifkan oleh admin.</p>
<div class="auth-divider"><span>ATAU</span></div>
<p class="auth-error" id="auth-error" hidden></p>
<form class="auth-form" id="form-login"><div class="auth-field"><label for="login-email">Email</label><input id="login-email" type="email" autocomplete="email" required placeholder="nama@email.com"></div><div class="auth-field"><label for="login-password">Password</label><div class="auth-password-wrap"><input id="login-password" type="password" autocomplete="current-password" required placeholder="Password"><button class="auth-eye" type="button" data-target="login-password" aria-label="Tampilkan password"><i class="fa-regular fa-eye"></i></button></div></div><label class="auth-remember"><input type="checkbox" id="remember-email" checked><span>Simpan email di perangkat ini</span></label><button class="auth-submit" id="login-submit" type="submit">Masuk</button></form>
<form class="auth-form" id="form-register" hidden><div class="auth-field"><label for="register-name">Nama</label><input id="register-name" type="text" autocomplete="name" required placeholder="Nama Anda"></div><div class="auth-field"><label for="register-email">Email</label><input id="register-email" type="email" autocomplete="email" required placeholder="nama@email.com"></div><div class="auth-field"><label for="register-password">Password</label><div class="auth-password-wrap"><input id="register-password" type="password" autocomplete="new-password" required placeholder="Minimal 8 karakter"><button class="auth-eye" type="button" data-target="register-password" aria-label="Tampilkan password"><i class="fa-regular fa-eye"></i></button></div></div><button class="auth-submit" id="register-submit" type="submit">Buat akun</button></form>
<p class="auth-switch" id="auth-switch-hint">Belum punya akun? <a href="#" id="auth-switch-link">Daftar di sini</a></p>
</div></div>
</main><script src="https://accounts.google.com/gsi/client" async defer></script><script src="login.js"></script></body></html>
